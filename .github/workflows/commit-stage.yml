concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

name: Commit Stage
on:
  push:
    branches: [main, development]
    paths:
      - 'backend/**'
      - 'deploy/**'
      - '.github/workflows/commit-stage.yml'
      - 'gradle/**'
      - 'gradlew'
      - 'settings.gradle'
  pull_request:
    branches: [main, development]
    paths:
      - 'backend/**'
      - 'deploy/**'
      - '.github/workflows/commit-stage.yml'
      - 'gradle/**'
      - 'gradlew'
      - 'settings.gradle'

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'edtech-project-510010' }}
  REGION: ${{ vars.GCP_REGION || 'europe-west1' }}
  GAR_REPOSITORY: edtech
  IMAGE_NAME: backend


jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write

    # PostgreSQL service container for integration tests
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: school_fee_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d school_fee_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4.9.1
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build, unit tests and integration tests
        run: |
          chmod +x ./gradlew
          ./gradlew build jacocoTestCoverageVerification
        env:
          SPRING_R2DBC_URL: r2dbc:postgresql://localhost:5432/school_fee_test
          SPRING_R2DBC_USERNAME: test_user
          SPRING_R2DBC_PASSWORD: test_pass
          R2DBC_URL: r2dbc:postgresql://localhost:5432/schoolfee_test
          JDBC_URL: jdbc:postgresql://localhost:5432/schoolfee_test
          DB_USERNAME: test_user
          DB_PASSWORD: test_pass

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: backend/build/test-results/**/TEST-*.xml
          retention-days: 7

      - name: Upload compiled JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/build/libs/*.jar
          if-no-files-found: error
          retention-days: 1

  package:
    name: Package and Publish and deploy
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development' || github.ref == 'refs/heads/developement') }}
    needs: [build]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      id-token: write
      security-events: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Determine Target Environment
        id: target-env
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "ENVIRONMENT=prod" >> $GITHUB_ENV
            echo "Deploying to PRODUCTION environment"
          else
            echo "ENVIRONMENT=test" >> $GITHUB_ENV
            echo "Deploying to TEST environment"
          fi

      - name: Generate version tag
        id: version
        run: |
          VERSION="${GITHUB_SHA::8}"
          IMAGE_URI="${{ env.REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}"
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "IMAGE_URI=${IMAGE_URI}" >> $GITHUB_OUTPUT
          echo "IMAGE_TAG=${VERSION}" >> $GITHUB_ENV

      # 1. Download pre-built JAR from build job
      - name: Download compiled JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend/build/libs/

      # 2. Prepare JAR for Docker build
      - name: Prepare JAR for Docker build
        run: |
          JAR_FILE=$(find backend/build/libs/ -name "*.jar" | head -n 1)
          if [ -z "$JAR_FILE" ]; then
            echo "Error: No JAR file found in backend/build/libs/!"
            find . -name "*.jar"
            exit 1
          fi
          echo "Found JAR: $JAR_FILE"
          cp "$JAR_FILE" app.jar
          ls -lh app.jar

      # 2. Authenticate with GCP (supports Service Account Key or Workload Identity)
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # 3. Set up Cloud SDK
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # 4. Configure Docker authentication for Google Artifact Registry
      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # 5. Build Spring Boot container image using fast pre-built JAR Dockerfile
      - name: Build container image
        run: |
          docker build \
            -t ${{ steps.version.outputs.IMAGE_URI }}:${{ steps.version.outputs.VERSION }} \
            -t ${{ steps.version.outputs.IMAGE_URI }}:latest \
            -f backend/Dockerfile.ci .

      # 6. Publish container image directly to Google Artifact Registry
      - name: Publish container image (versioned)
        run: docker push ${{ steps.version.outputs.IMAGE_URI }}:${{ steps.version.outputs.VERSION }}

      - name: Publish container image (latest)
        run: docker push ${{ steps.version.outputs.IMAGE_URI }}:latest

      # 7. Continuous Deployment to Cloud Run
      - name: Deploy to Cloud Run (${{ env.ENVIRONMENT }})
        if: ${{ vars.AUTO_DEPLOY != 'false' }}
        run: |
          chmod +x ./deploy/deploy-backend.sh
          ./deploy/deploy-backend.sh "${{ env.ENVIRONMENT }}"

      # 8. OCI image vulnerability scanning (post-deploy audit)
      - name: OCI image vulnerability scanning
        uses: anchore/scan-action@v6
        continue-on-error: true
        with:
          image: ${{ steps.version.outputs.IMAGE_URI }}:${{ steps.version.outputs.VERSION }}
          fail-build: false
          severity-cutoff: high
          output-format: table

      # 9. Generate SBOM
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        continue-on-error: true
        with:
          image: ${{ steps.version.outputs.IMAGE_URI }}:${{ steps.version.outputs.VERSION }}
          format: spdx-json
          output-file: sbom.json

      - name: Upload SBOM artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
          retention-days: 90
