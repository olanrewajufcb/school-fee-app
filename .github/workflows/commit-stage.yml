name: Commit Stage
on:
  push:
    branches: [main, development, developement]
  pull_request:
    branches: [main, development, developement]

env:
  GAR_LOCATION: ${{ vars.GAR_LOCATION }}
  GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY }}
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  IMAGE_NAME: school-management-backend

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    # PostgreSQL service container for integration tests
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: school_fee_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Code vulnerability scanning
        uses: anchore/scan-action@v7
        id: scan
        with:
          path: "${{ github.workspace }}"
          fail-build: false
          severity-cutoff: high
          output-format: sarif

      - name: Upload vulnerability report
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        if: ${{ steps.scan.outputs.sarif != '' }}
        with:
          sarif_file: ${{ steps.scan.outputs.sarif}}

      - name: Build, unit tests and integration tests
        run: |
          chmod +x ./gradlew
          ./gradlew build jacocoTestCoverageVerification
        env:
          SPRING_R2DBC_URL: r2dbc:postgresql://localhost:5432/school_fee_test
          SPRING_R2DBC_USERNAME: test_user
          SPRING_R2DBC_PASSWORD: test_pass

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/test-results/**/TEST-*.xml
          retention-days: 7

      - name: Upload coverage report
        uses: codecov/codecov-action@v3
        with:
          file: build/reports/jacoco/test/jacocoTestReport.xml
          fail_ci_if_error: false

  package:
    name: Package and Publish
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development' || github.ref == 'refs/heads/developement') }}
    needs: [build]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      id-token: write
      security-events: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history for proper versioning

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Validate Artifact Registry configuration
        run: |
          test -n "${GAR_LOCATION}" || (echo "GAR_LOCATION repository variable is required" && exit 1)
          test -n "${GAR_REPOSITORY}" || (echo "GAR_REPOSITORY repository variable is required" && exit 1)
          test -n "${GCP_PROJECT_ID}" || (echo "GCP_PROJECT_ID repository variable is required" && exit 1)

      - name: Generate version tag
        id: version
        run: |
          echo "VERSION=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
          echo "GIT_REF=$(echo ${GITHUB_REF#refs/heads/})" >> $GITHUB_OUTPUT
          echo "IMAGE_URI=${GAR_LOCATION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}" >> $GITHUB_OUTPUT
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "CHANNEL=prod" >> $GITHUB_OUTPUT
          else
            echo "CHANNEL=dev" >> $GITHUB_OUTPUT
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      - name: Build container image
        run: |
          chmod +x gradlew
          ./gradlew bootBuildImage \
            --imageName ${{ steps.version.outputs.IMAGE_URI }}:${{ steps.version.outputs.VERSION }}
        
      - name: Tag channel image
        run: |
          docker tag ${{ steps.version.outputs.IMAGE_URI }}:${{ steps.version.outputs.VERSION }} \
            ${{ steps.version.outputs.IMAGE_URI }}:${{ steps.version.outputs.CHANNEL }}

      - name: Tag latest image
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          docker tag ${{ steps.version.outputs.IMAGE_URI }}:${{ steps.version.outputs.VERSION }} \
            ${{ steps.version.outputs.IMAGE_URI }}:latest

      - name: OCI image vulnerability scanning
        uses: anchore/scan-action@v7
        id: scan
        with:
          image: ${{ steps.version.outputs.IMAGE_URI }}:${{ steps.version.outputs.VERSION }}
          fail-build: false
          severity-cutoff: high
          output-format: sarif
      - name: Upload vulnerability report
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        if: ${{ steps.scan.outputs.sarif != '' }}
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}

      - name: Publish container image (versioned)
        run: docker push ${{ steps.version.outputs.IMAGE_URI }}:${{ steps.version.outputs.VERSION }}

      - name: Publish container image (channel)
        run: docker push ${{ steps.version.outputs.IMAGE_URI }}:${{ steps.version.outputs.CHANNEL }}
      
      - name: Publish container image (latest)
        if: ${{ github.ref == 'refs/heads/main' }}
        run: docker push ${{ steps.version.outputs.IMAGE_URI }}:latest

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.version.outputs.IMAGE_URI }}:${{ steps.version.outputs.VERSION }}
          format: spdx-json
          output-file: sbom.json
      
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
          retention-days: 90
